# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FoundaPay ERP — Nginx configuration
# Install:
#   cp nginx.conf /etc/nginx/sites-available/foundapay
#   ln -s /etc/nginx/sites-available/foundapay /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Then run: certbot --nginx -d portal.foundapay.com
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

server {
    listen 80;
    server_name portal.foundapay.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.foundapay.com;

    ssl_certificate     /etc/letsencrypt/live/portal.foundapay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.foundapay.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY                                  always;
    add_header X-Content-Type-Options nosniff                        always;
    add_header X-XSS-Protection "1; mode=block"                      always;
    add_header Strict-Transport-Security "max-age=31536000"          always;
    add_header Referrer-Policy "strict-origin-when-cross-origin"     always;

    # Body size — allow generous upload for proof screenshots / CSV imports
    client_max_body_size 10M;

    # API proxy → Node backend on 5001
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  75s;
    }

    # Self-hosted payment pages — public, no auth, served by backend
    # Customer-facing URL: https://portal.foundapay.com/pay/<token>
    location /pay/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Generated PDF receipts (if you stage them on disk later)
    location /receipts/ {
        alias /var/www/foundapay/receipts/;
        add_header Content-Disposition "attachment";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/foundapay/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Frontend SPA — fallback to index.html
    location / {
        root /var/www/foundapay/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Block access to dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
